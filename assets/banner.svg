<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="bg" cx="28%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#163022"/>
      <stop offset="55%" stop-color="#0f1a22"/>
      <stop offset="100%" stop-color="#0a0e13"/>
    </radialGradient>
    <linearGradient id="flowg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#5ec97a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1f3a2a"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- faint loop -->
  <path d="M760 140 H1120 V420 H820" fill="none" stroke="#1f6b43" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M760 500 H160 V260 H560" fill="none" stroke="#1f6b43" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- animated flowing line -->
  <path d="M760 460 V220 a40 40 0 0 1 40-40 h320" fill="none" stroke="url(#flowg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="20 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- battery -->
  <g transform="translate(160,300)">
    <rect x="-44" y="-78" width="88" height="156" rx="14" fill="#1a2129" stroke="#3a4551" stroke-width="4"/>
    <line x1="-20" y1="-78" x2="-20" y2="-52" stroke="#ff5b5b" stroke-width="8" stroke-linecap="round"/>
    <text x="-12" y="-22" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="#ff5b5b">+</text>
    <text x="-12" y="56" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="#5ba3ff">−</text>
  </g>

  <!-- resistor -->
  <g transform="translate(420,260)">
    <rect x="-90" y="-26" width="180" height="52" rx="26" fill="#d9b382" stroke="#7a5a30" stroke-width="3"/>
    <g stroke="#6b4226" stroke-width="8" stroke-linecap="round">
      <line x1="-54" y1="0" x2="-18" y2="0"/><line x1="18" y1="0" x2="54" y2="0"/>
    </g>
  </g>

  <!-- LED -->
  <circle cx="1120" cy="220" r="70" fill="#3ddc84" filter="url(#glow)" opacity="0.9"/>
  <circle cx="1120" cy="220" r="42" fill="#d6ffe8"/>
  <g stroke="#0c1117" stroke-width="10" stroke-linecap="round">
    <line x1="1106" y1="206" x2="1134" y2="234"/>
    <line x1="1134" y1="206" x2="1106" y2="234"/>
  </g>
  <g stroke="#3ddc84" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="1120" y1="130" x2="1120" y2="106"/>
    <line x1="1070" y1="150" x2="1053" y2="133"/>
    <line x1="1170" y1="150" x2="1187" y2="133"/>
  </g>

  <!-- multimeter -->
  <g transform="translate(960,470)">
    <rect x="-70" y="-60" width="140" height="120" rx="16" fill="#111922" stroke="#3ddc84" stroke-width="4"/>
    <rect x="-54" y="-46" width="108" height="44" rx="6" fill="#0a1a12"/>
    <text x="-44" y="-14" font-family="'Courier New',monospace" font-size="26" fill="#3ddc84" font-weight="bold">9.12V</text>
    <circle cx="-30" cy="26" r="10" fill="#ff5b5b"/>
    <circle cx="0" cy="26" r="10" fill="#5ba3ff"/>
    <circle cx="30" cy="26" r="10" fill="#3ddc84"/>
  </g>

  <!-- text -->
  <text x="80" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="68" font-weight="800" fill="#e8eef5">Circuit Boards,</text>
  <text x="80" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="68" font-weight="800" fill="#3ddc84">Visually.</text>
  <text x="82" y="250" font-family="'Segoe UI',Arial,sans-serif" font-size="26" fill="#9fb0c0">Short words · Interactive diagrams · No jargon</text>

  <g font-family="'Segoe UI',Arial,sans-serif" font-size="22" fill="#cdd9e4">
    <!-- plug icon + text -->
    <g transform="translate(82,360)">
      <g transform="translate(-2,-16)" fill="#3ddc84">
        <rect x="0" y="0" width="20" height="14" rx="3"/>
        <rect x="4" y="14" width="4" height="10"/>
        <rect x="12" y="14" width="4" height="10"/>
        <rect x="6" y="-8" width="3" height="9"/>
        <rect x="11" y="-8" width="3" height="9"/>
      </g>
      <text x="34" y="0">Learn the loop, the parts &amp; why resistors exist</text>
    </g>
    <!-- magnifier icon + text -->
    <g transform="translate(82,400)">
      <g transform="translate(-2,-18)" fill="none" stroke="#3ddc84" stroke-width="3.5" stroke-linecap="round">
        <circle cx="9" cy="9" r="8"/>
        <line x1="15" y1="15" x2="24" y2="24"/>
      </g>
      <text x="34" y="0">Understand every setting on your multimeter</text>
    </g>
    <!-- sun icon + text -->
    <g transform="translate(82,440)">
      <g transform="translate(-2,-18)" fill="none" stroke="#ffd24a" stroke-width="3.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="6"/>
        <line x1="11" y1="-1" x2="11" y2="-8"/>
        <line x1="11" y1="30" x2="11" y2="37"/>
        <line x1="-1" y1="11" x2="-8" y2="11"/>
        <line x1="30" y1="11" x2="37" y2="11"/>
        <line x1="3" y1="3" x2="-2" y2="-2"/>
        <line x1="19" y1="19" x2="24" y2="24"/>
        <line x1="19" y1="3" x2="24" y2="-2"/>
        <line x1="3" y1="19" x2="-2" y2="24"/>
      </g>
      <text x="34" y="0">See why a solar panel isn&apos;t an LED (and what to do instead)</text>
    </g>
  </g>

  <text x="82" y="560" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="#5a6b7a">A free, single-file interactive guide — works offline in any browser.</text>
</svg>
