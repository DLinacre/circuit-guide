<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#163022"/>
      <stop offset="100%" stop-color="#0c1117"/>
    </radialGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" stroke="#1f6b43" stroke-width="6"/>
  <!-- circuit loop wires (solid hex) -->
  <path d="M120 300 V180 a40 40 0 0 1 40-40 h112" fill="none" stroke="#5ec97a" stroke-width="14" stroke-linecap="round"/>
  <path d="M392 252 v68 a40 40 0 0 1-40 40 H160" fill="none" stroke="#5ec97a" stroke-width="14" stroke-linecap="round"/>
  <!-- resistor zigzag on top wire -->
  <path d="M196 140 h26 l12-20 l20 40 l20-40 l20 40 l12-20 h26" fill="none" stroke="#e0a96d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- battery -->
  <g transform="translate(120,300)">
    <rect x="-26" y="-46" width="52" height="92" rx="10" fill="#2a333d" stroke="#4a5561" stroke-width="4"/>
    <line x1="-12" y1="-46" x2="-12" y2="-30" stroke="#ff5b5b" stroke-width="6" stroke-linecap="round"/>
    <text x="-6" y="-12" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#ff5b5b">+</text>
  </g>
  <!-- LED glow -->
  <circle cx="392" cy="212" r="50" fill="#3ddc84" filter="url(#g)" opacity="0.9"/>
  <circle cx="392" cy="212" r="30" fill="#d6ffe8"/>
  <g stroke="#0c1117" stroke-width="7" stroke-linecap="round">
    <line x1="382" y1="202" x2="402" y2="222"/>
    <line x1="402" y1="202" x2="382" y2="222"/>
  </g>
  <g stroke="#3ddc84" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="392" y1="150" x2="392" y2="130"/>
    <line x1="356" y1="162" x2="342" y2="148"/>
    <line x1="428" y1="162" x2="442" y2="148"/>
  </g>
</svg>
